name: exp-rust-sandbox
# Experiment: which "fetch online, build offline" network-isolation mechanism
# actually holds on GitHub runners against a malicious build.rs?
on:
  push:
    branches: [exp/rust-sandbox]
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        mechanism:
          - baseline
          - A-unshare-setpriv
          - B-docker-rust
          - C-bwrap
          - C-bwrap-sudo
          - D-nft-uid
          - D-systemd-run
    runs-on: ubuntu-24.04
    env:
      RUST_IMAGE: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: install bubblewrap (C only)
        if: startsWith(matrix.mechanism, 'C-')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: environment probe
        run: |
          set -x
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
          bwrap --version 2>&1 || echo "no bwrap"
          nft --version 2>&1 || echo "no nft"
          systemd-run --version 2>&1 | head -1 || echo "no systemd-run"
          docker images --format '{{.Repository}}:{{.Tag}}' 2>&1 | head -40 || echo "no docker"
          id; cargo --version; rustc --version
      - name: online fetch phase (network ON)
        working-directory: rust-exp/sandbox
        run: |
          cargo generate-lockfile
          cargo fetch --locked
      - name: pre-pull toolchain image (B only, network ON)
        if: matrix.mechanism == 'B-docker-rust'
        run: docker pull "$RUST_IMAGE"
      - name: offline build under sandbox
        env:
          MECH: ${{ matrix.mechanism }}
        run: |
          export WORKDIR="$PWD/rust-exp/sandbox"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          t0=$SECONDS
          bash rust-exp/sandbox/wrap.sh "$MECH"; rc=$?
          printf 'WALL_CLOCK_SECONDS=%s FINAL_RC=%s\n' "$((SECONDS - t0))" "$rc"
          exit "$rc"
      - name: save lockfile
        if: matrix.mechanism == 'baseline'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: rust-exp/sandbox/Cargo.lock

  # Winner re-run on arm64 (filled in after the x64 pass picks a winner).
  linux-arm:
    strategy:
      fail-fast: false
      matrix:
        mechanism:
          - A-unshare-setpriv
          - D-systemd-run
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: online fetch phase (network ON)
        working-directory: rust-exp/sandbox
        run: |
          cargo generate-lockfile
          cargo fetch --locked
      - name: offline build under sandbox
        env:
          MECH: ${{ matrix.mechanism }}
        run: |
          export WORKDIR="$PWD/rust-exp/sandbox"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          t0=$SECONDS
          bash rust-exp/sandbox/wrap.sh "$MECH"; rc=$?
          printf 'WALL_CLOCK_SECONDS=%s FINAL_RC=%s\n' "$((SECONDS - t0))" "$rc"
          exit "$rc"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: online fetch
        working-directory: rust-exp/sandbox
        run: |
          cargo generate-lockfile
          cargo fetch --locked
      - name: sandbox-exec deny network
        working-directory: rust-exp/sandbox
        run: |
          cat > /tmp/no-net.sb <<'SB'
          (version 1)
          (allow default)
          (deny network*)
          SB
          set -x
          # Probe should report BLOCKED; build should still succeed.
          sandbox-exec -f /tmp/no-net.sb cargo build --offline --locked; rc=$?
          sandbox-exec -f /tmp/no-net.sb cargo test --offline --locked || true
          printf 'MAC_FINAL_RC=%s\n' "$rc"
