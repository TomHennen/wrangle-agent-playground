name: phase3-container-sign

# Playground validation for wrangle PR #703 (Phase 3 containerized signing).
# Pins wrangle DIRECTLY at the PR head SHA and runs the python build+attest
# reusable workflow twice: once with in-container keyless signing on
# (verify-in-container: true) and once with the break-glass in-job path
# (false), so their VSA signer identities can be compared.

on:
  workflow_dispatch:

permissions: {}

jobs:
  in-container:
    permissions:
      actions: read
      security-events: write
      contents: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@e799807c3ff998955221ab75082c478ace027403 # zizmor: ignore[unpinned-uses] PR #703 head under test
    with:
      path: python-pip
      release-events: non-pull-request
      verify-in-container: true

  in-job:
    permissions:
      actions: read
      security-events: write
      contents: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@e799807c3ff998955221ab75082c478ace027403 # zizmor: ignore[unpinned-uses] PR #703 head under test
    with:
      path: python-pip
      release-events: non-pull-request
      verify-in-container: false
