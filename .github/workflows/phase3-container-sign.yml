name: phase3-container-sign

# Playground validation for wrangle PR #703 (Phase 3 containerized signing).
# Pins wrangle DIRECTLY at the PR head SHA. Signing is unconditional (activated
# by the catalog token: sigstore grant alone) — no verify-in-container input.

on:
  workflow_dispatch:

permissions: {}

jobs:
  python:
    permissions:
      actions: read
      security-events: write
      contents: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_python.yml@a5af9d7a955e62fd0acc0087eee0f5f6ae70bcbf # zizmor: ignore[unpinned-uses] PR #703 head under test
    with:
      path: python-pip
      release-events: non-pull-request

  container:
    permissions:
      actions: read
      security-events: write
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: TomHennen/wrangle/.github/workflows/build_and_publish_container.yml@a5af9d7a955e62fd0acc0087eee0f5f6ae70bcbf # zizmor: ignore[unpinned-uses] PR #703 head under test
    with:
      path: container
      imagename: ghcr.io/tomhennen/wrangle-agent-playground/phase3-sign
      registry: ghcr.io
      release-events: non-pull-request
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
