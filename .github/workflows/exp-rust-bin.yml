name: exp-rust-bin
# Experiment: macOS sandbox-exec network profile; cargo-auditable SBOM via wrangle's syft adapter.
on:
  push:
    branches: [exp/rust-bin]
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mac-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: env
        run: |
          sw_vers; id; cargo --version; sudo -n true && echo "sudo ok"
      - name: online fetch
        working-directory: rust-exp/bin/macfix
        run: cargo fetch --locked
      - name: summary (flat log)
        run: |
          for p in P0-deny-all P1-localhost P2-localhost+unix P3-localhost+bindunix P4-split-rules; do
            echo "=================== $p"
            bash rust-exp/bin/mac_run.sh "$p" 2>&1 | grep -E 'PROFILE|PROBE a\.|XPROBE|test |test result|Finished|error|INNER_RC|SANDBOX_EXEC_RC|deprecat|WARN' || true
          done

      - name: control - the same escapes OUTSIDE the sandbox
        run: |
          OUT=/tmp/ctl-out; rm -f $OUT
          launchctl submit -l wrangle.ctl -o $OUT -e $OUT -- /usr/bin/curl -s -o /dev/null -m 6 -w 'http=%{http_code}' http://example.com; echo "submit rc=$?"
          sleep 8; echo "CTL launchctl-submit: $(cat $OUT 2>&1)"
          echo "CTL osascript: $(osascript -e 'do shell script "curl -s -o /dev/null -m 6 -w http=%{http_code} http://example.com"' 2>&1)"
          echo "CTL host: $(host -W 4 example.com 2>&1 | head -1)"
          echo "CTL sudo-curl: $(sudo -n curl -s -o /dev/null -m 6 -w http=%{http_code} http://example.com 2>&1)"
      - name: P4 out-of-process escapes
        run: |
          PROF='(version 1)(allow default)(deny network*)(allow network-bind (local ip "localhost:*"))(allow network-inbound (local ip "localhost:*"))(allow network-outbound (remote ip "localhost:*"))'
          sandbox-exec -p "$PROF" bash rust-exp/bin/mac_escape.sh 2>&1
          echo "--- control (unsandboxed) result for launchd job:"; cat /tmp/esc-launchd.txt 2>&1 || true
      - name: sandbox-exec deprecation text
        run: |
          sandbox-exec -p '(version 1)(allow default)' true; echo "rc=$? (stderr above, if any)"
          man sandbox-exec 2>/dev/null | col -b | sed -n 1,40p | grep -iE 'deprecat|DEPRECAT' || echo "no deprecation text in man page"

  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cd rust-exp/bin/aud && cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with: { name: audlock, path: rust-exp/bin/aud/Cargo.lock }

  build:
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, tag: linux,   asset: cargo-auditable-x86_64-unknown-linux-gnu.tar.xz }
          - { os: macos-15,     tag: macos,   asset: cargo-auditable-aarch64-apple-darwin.tar.xz }
          - { os: windows-2025, tag: windows, asset: cargo-auditable-x86_64-pc-windows-msvc.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: audlock, path: rust-exp/bin/aud }
      - name: install cargo-auditable from release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir dl && cd dl
          tag=$(gh api repos/rust-secure-code/cargo-auditable/releases/latest --jq .tag_name)
          echo "cargo-auditable latest=$tag"
          gh release download "$tag" -R rust-secure-code/cargo-auditable -p "$ASSET" -p "$ASSET.sha256"
          ls -l; cat "$ASSET.sha256"
          want=$(awk '{print $1}' "$ASSET.sha256")
          if command -v sha256sum >/dev/null; then got=$(sha256sum "$ASSET" | awk '{print $1}'); else got=$(shasum -a 256 "$ASSET" | awk '{print $1}'); fi
          [ "$want" = "$got" ] && echo "SHA256 VERIFIED $got" || { echo "SHA256 MISMATCH $want $got"; exit 1; }
          case "$ASSET" in
            *.zip) pwsh -c "Expand-Archive -Path $ASSET -DestinationPath x" ;;
            *) mkdir x && tar -xJf "$ASSET" -C x ;;
          esac
          mkdir -p "$HOME/auditbin"
          find x -type f -name 'cargo-auditable*' -exec cp {} "$HOME/auditbin/" \;
          chmod +x "$HOME/auditbin"/* || true
          ls -l "$HOME/auditbin"
          if command -v cygpath >/dev/null; then cygpath -w "$HOME/auditbin" >> "$GITHUB_PATH"; else echo "$HOME/auditbin" >> "$GITHUB_PATH"; fi
      - name: build
        working-directory: rust-exp/bin/aud
        run: |
          cargo auditable --version || true
          cargo auditable build --release --locked
          mkdir -p ../../../aud-out/auditable ../../../aud-out/plain
          ext=""; [ "${{ matrix.tag }}" = windows ] && ext=".exe"
          cp "target/release/audprobe$ext" ../../../aud-out/auditable/
          if [ "${{ matrix.tag }}" = linux ]; then
            cargo build --release --locked --target-dir target-plain
            cp target-plain/release/audprobe ../../../aud-out/plain/
            ls -l target/release/audprobe target-plain/release/audprobe
          fi
          ls -lR ../../../aud-out
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.tag }}
          path: aud-out

  scan:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bin-linux, path: aud-out }
      - uses: actions/download-artifact@v4
        with: { name: bin-macos, path: dl-macos }
      - uses: actions/download-artifact@v4
        with: { name: bin-windows, path: dl-windows }
      - uses: actions/download-artifact@v4
        with: { name: audlock, path: rust-exp/bin/aud }
      - name: stage cross-format binaries
        run: |
          mkdir -p aud-out/macos aud-out/windows
          cp dl-macos/auditable/audprobe aud-out/macos/audprobe-macho
          cp dl-windows/auditable/audprobe.exe aud-out/windows/
          chmod +x aud-out/auditable/audprobe aud-out/plain/audprobe
          file aud-out/*/* | sed 's/^/FILE /'
      - name: install syft 1.51.1 (wrangle's pin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sy && cd sy
          gh release download v1.51.1 -R anchore/syft -p syft_1.51.1_checksums.txt -p syft_1.51.1_linux_amd64.tar.gz
          grep ' syft_1.51.1_linux_amd64.tar.gz$' syft_1.51.1_checksums.txt | sha256sum -c -
          tar -xzf syft_1.51.1_linux_amd64.tar.gz syft
          sudo install syft /usr/local/bin/syft; syft version | head -3
      - name: scan with wrangle's adapter (unchanged)
        run: bash rust-exp/bin/scan.sh 2>&1
      - name: wrangle's actual tool image, --network none (scenario i)
        run: |
          IMG='ghcr.io/tomhennen/wrangle/syft@sha256:3231d30a5f69059dac984f57eea88bc0ed315832299e5ed450577e4e3bec9949'
          if docker pull "$IMG" 2>&1 | tail -2; then
            mkdir -p img-out; chmod 777 img-out; chmod -R a+rX scan/in-aud
            docker run --rm --network none -v "$PWD/scan/in-aud:/src:ro" -v "$PWD/img-out:/out" "$IMG" /src /out || echo "image rc=$?"
            jq '.packages|length' img-out/sbom.spdx.json
            jq -r '[.packages[].name]|sort|join(" ")' img-out/sbom.spdx.json
          else echo "IMAGE NOT PULLABLE"; fi
      - name: osv-scanner 2.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir osv && cd osv
          gh release download v2.6.0 -R google/osv-scanner -p osv-scanner_linux_amd64 -p osv-scanner_SHA256SUMS
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64; sudo install osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          cd ..
          osv-scanner --version
          osv-scanner scan source --help 2>&1 | grep -iE 'artifact|binary|sbom|lockfile|-L' | head
          echo "--- osv on directory with auditable binary"
          osv-scanner scan source -r scan/in-aud 2>&1 | tail -25 || true
          echo "--- osv on source tree (Cargo.lock)"
          osv-scanner scan source -r scan/in-src 2>&1 | tail -25 || true
          echo "--- osv on syft SPDX sbom from auditable binary"
          osv-scanner scan source --sbom scan/i-auditable-bin/sbom.spdx.json 2>&1 | tail -15 || true
