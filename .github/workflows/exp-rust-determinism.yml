name: exp-rust-determinism
on:
  push:
    branches: [exp/rust-determinism]
permissions:
  contents: read
jobs:
  lockgen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd rust-exp/determinism
          cargo --version
          cargo generate-lockfile
          echo ===LOCK-B64===
          base64 -w0 Cargo.lock
          echo
