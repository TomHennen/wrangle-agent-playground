name: exp-bot-pr
# Experiment: CI for a PR branch supplied by explicit dispatch with the workflow token, then a token merge.
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
permissions: {}
jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: PR state before any CI
        run: gh pr view "$BRANCH" --json statusCheckRollup,mergeStateStatus,headRefOid
      - name: Dispatch CI on the PR branch and wait
        run: |
          gh workflow run exp-ci.yml --ref "$BRANCH"
          sleep 15
          run_id="$(gh run list --workflow exp-ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$run_id" --exit-status
      - name: PR state after dispatched CI
        run: |
          sleep 10
          gh pr view "$BRANCH" --json statusCheckRollup,mergeStateStatus,headRefOid
      - name: Merge with the workflow token
        if: ${{ !cancelled() }}
        run: gh pr merge "$BRANCH" --squash
