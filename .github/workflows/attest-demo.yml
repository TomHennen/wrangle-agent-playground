name: wrangle-attest demo
on:
  workflow_dispatch:
permissions: {}
jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # ambient OIDC -> Fulcio, so signing needs no human
      contents: read
    steps:
      - uses: actions/checkout@v4          # the playground: demo.sh
        with:
          persist-credentials: false
      - uses: actions/checkout@v4          # wrangle @ #763: the engine source
        with:
          repository: TomHennen/wrangle
          ref: a74a5211554d27b4e721654e7efee7a6c779391a
          path: wrangle
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: wrangle/tools/go.mod
          cache: false
      - name: Build wrangle-attest
        run: go -C wrangle/tools build -o /tmp/wrangle-attest ./wrangle-attest
      - name: Demo
        run: bash demo.sh
