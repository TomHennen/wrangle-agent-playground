[package]
name = "audprobe"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libz-sys = { version = "1", features = ["static"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
autocfg = "1"
